<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>고교 선택 길잡이</title>
<script>
// ▼ 응답을 구글 시트로 모으려면, Apps Script 웹 앱 주소를 아래 따옴표 안에 붙여 넣으세요.
//   예: const GAS_URL = "https://script.google.com/macros/s/AKfy.../exec";
const GAS_URL = "https://script.google.com/macros/s/AKfycbwtOPZzBDxOw5vrZTJIZ_X313ZYt1cj2o5rOML06ApGNcOgEHgveWcEnV8IoYGQicPq/exec";
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 길 안내 표지판: 남색 노선 띠 위에 역 네 개, 지금 있는 역만 신호 노랑. 본문은 한 줄 흐름. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#141b2d; --muted:#5a6377; --line:#d7dce8; --soft:#e9edf6;
  --hdr:#1b2d5c; --hdr-ink:#ffffff; --hdr-muted:#b6c2e2; --hdr-line:#3a4f8a;
  --primary:#1f3b8a; --primary-ink:#ffffff; --signal:#f4b90b; --signal-ink:#2e2300;
  --near:#17834a; --near-bg:#e2f4e9; --mid:#1f55d6; --mid-bg:#e4ecfd; --far:#c92a2a; --far-bg:#fbe5e5;
  --warn:#7a5200; --warn-bg:#fff3cf; --land:#dfe5f0; --land-line:#ffffff; --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.06);
  --display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1320; --surface:#151d30; --ink:#edf0f7; --muted:#9aa4bb; --line:#2a344d; --soft:#1d2740;
  --hdr:#101a36; --hdr-ink:#ffffff; --hdr-muted:#93a1c6; --hdr-line:#2c3c6c;
  --primary:#4a6fe0; --primary-ink:#ffffff; --signal:#f4b90b; --signal-ink:#2e2300;
  --near:#48d08a; --near-bg:#123423; --mid:#86aaff; --mid-bg:#182b58; --far:#ff8585; --far-bg:#471b1e;
  --warn:#ffd36b; --warn-bg:#3b2f0d; --land:#232e4a; --land-line:#151d30; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1320; --surface:#151d30; --ink:#edf0f7; --muted:#9aa4bb; --line:#2a344d; --soft:#1d2740;
  --hdr:#101a36; --hdr-ink:#ffffff; --hdr-muted:#93a1c6; --hdr-line:#2c3c6c;
  --primary:#4a6fe0; --primary-ink:#ffffff; --signal:#f4b90b; --signal-ink:#2e2300;
  --near:#48d08a; --near-bg:#123423; --mid:#86aaff; --mid-bg:#182b58; --far:#ff8585; --far-bg:#471b1e;
  --warn:#ffd36b; --warn-bg:#3b2f0d; --land:#232e4a; --land-line:#151d30; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding-left:1.15em}
a{color:var(--primary)}
:root[data-theme="dark"] a{color:var(--mid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--mid)}}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- 노선 머리띠 ---------- */
.top{background:var(--hdr);color:var(--hdr-ink)}
.top-in{max-width:900px;margin:0 auto;padding-inline:20px;padding-block:18px 16px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.01em;line-height:1.1}
.brand span{color:var(--hdr-muted);font-size:13.5px}
.line{position:relative;display:grid;grid-template-columns:repeat(4,1fr)}
.line::before{content:"";position:absolute;left:12.5%;right:12.5%;top:11px;height:4px;background:var(--hdr-line);border-radius:2px}
.line i{position:absolute;left:12.5%;top:11px;height:4px;background:var(--signal);border-radius:2px;width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--hdr-muted);font-size:13.5px;cursor:default}
.stn::before{content:"";width:18px;height:18px;margin-top:4px;border-radius:50%;background:var(--hdr);border:4px solid var(--hdr-line);transition:border-color .3s, background .3s, transform .3s}
.stn.done{color:var(--hdr-ink);cursor:pointer}
.stn.done::before{border-color:var(--signal);background:var(--signal)}
.stn.now{color:var(--hdr-ink);font-weight:600}
.stn.now::before{border-color:var(--signal);background:var(--hdr-ink);transform:scale(1.25)}

/* ---------- 본문 ---------- */
.wrap{max-width:900px;margin:0 auto;padding-inline:20px;padding-block:24px 140px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;flex-direction:column;gap:6px}
.hd h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.2;text-wrap:balance}
.hd p{color:var(--muted);max-width:62ch}
.back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);cursor:pointer;font-size:14.5px}
.back:hover{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600;min-height:48px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* 거주지 */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.pick select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;min-height:50px;width:100%}
.hint{font-size:13.5px;color:var(--muted)}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;border-top:1px dashed var(--line);padding-top:18px}
.stamp{font-family:var(--display);font-size:26px;line-height:1;padding:14px 16px;border:3px solid currentColor;border-radius:12px;transform:rotate(-4deg);white-space:nowrap;animation:stamp .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.5)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
.stamp.eq{color:var(--mid)} .stamp.ne{color:var(--far)} .stamp.mx{color:var(--warn)}
.verdict h2{font-size:19px;line-height:1.35;margin-bottom:6px;text-wrap:balance}
.verdict ul{color:var(--muted);display:flex;flex-direction:column;gap:4px;font-size:15px}
.verdict .ex{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px}

/* 갈림길 */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.way{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.way:hover{transform:translateY(-2px);border-color:var(--primary)}
.way .sign{align-self:flex-start;font-family:var(--display);font-size:15px;background:var(--hdr);color:var(--hdr-ink);padding:4px 10px;border-radius:6px}
.way h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.way p{color:var(--muted);font-size:15px}
.way .go{margin-top:auto;font-weight:600;color:var(--primary)}
:root[data-theme="dark"] .way .go{color:var(--mid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .way .go{color:var(--mid)}}

/* 유형 카드 */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s,border-color .15s}
.cat:hover{transform:translateY(-2px);border-color:var(--primary)}
.cat h3{font-size:17.5px;line-height:1.3}
.cat p{color:var(--muted);font-size:14px}
.cat .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;align-items:center}
.cat .cnt{font-size:13.5px;color:var(--muted)}
.cat .mine{font-size:13px;font-weight:600;color:var(--near)}

/* 칩 */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.chip.pre{background:var(--signal);color:var(--signal-ink)}
.chip.post{border-color:var(--primary);color:var(--primary)}
:root[data-theme="dark"] .chip.post{border-color:var(--mid);color:var(--mid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.post{border-color:var(--mid);color:var(--mid)}}
.chip.etc{background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--near-bg);color:var(--near)}
.chip.limit{background:var(--warn-bg);color:var(--warn)}
.chip.check{background:var(--soft);color:var(--muted)}
.km{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 8px;font-size:14px;white-space:nowrap}
.km.b0{background:var(--near-bg);color:var(--near)} .km.b1{background:var(--mid-bg);color:var(--mid)} .km.b2{background:var(--far-bg);color:var(--far)}

/* 걸러 보기 */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:38px}
.tog[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tools input[type="search"]{flex:1 1 160px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-height:38px}
.note{font-size:14.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}

/* 표 */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.thead,.row{display:grid;gap:10px;align-items:center;padding:10px 14px}
.thead{background:var(--soft);font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.row{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.row:hover{background:var(--soft)}
.row.on{background:var(--mid-bg)}
.row.dim{opacity:.62}
.tbl.loc .thead,.tbl.loc .row{grid-template-columns:38px minmax(0,1fr) 104px 56px 168px}
.tbl.nat .thead,.tbl.nat .row{grid-template-columns:38px minmax(0,1fr) 150px 100px 80px}
.rk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:transparent;flex:none}
.row.on .rk{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.nm{min-width:0;display:flex;flex-direction:column;gap:1px}
.nm b{font-weight:600;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.nm .m{display:none}
.c{font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.r{text-align:right;justify-self:end}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 지도 */
.wrap.wide{max-width:1280px}
.split{display:flex;flex-direction:column;gap:18px}
.split > .lst{display:flex;flex-direction:column;gap:18px;min-width:0}
.mapp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.mapp .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mapp .mh b{font-family:var(--display);font-weight:400;font-size:19px;margin-right:auto}
.mapp svg{display:block;width:100%;max-width:520px;height:auto;max-height:78vh;margin-inline:auto;border-radius:10px;background:var(--bg)}
.mapp .mn{font-size:12.5px;color:var(--muted);line-height:1.6}
.mapp.shut #mapbox{display:none}
.m-land{fill:var(--land);stroke:var(--land-line);stroke-width:1;stroke-linejoin:round}
.m-ring{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
.m-rt{font-size:11px;fill:var(--muted);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.m-city{font-size:10px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:2.5px;opacity:.9}
.m-dot{opacity:.55}
.m-ln{stroke-width:1.6;stroke-dasharray:2 3;fill:none}
.m-mk{stroke:var(--surface);stroke-width:2}
.m-mt{font-size:11.5px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.m-lb{font-size:12.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.m-base{fill:var(--ink);stroke:var(--surface);stroke-width:1.5}
.f0{fill:var(--near)} .f1{fill:var(--mid)} .f2{fill:var(--far)}
.s0{stroke:var(--near)} .s1{stroke:var(--mid)} .s2{stroke:var(--far)}
.top-in.wide,.tray-in.wide{max-width:1280px}
@media (min-width:1000px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 430px;align-items:start}
  .split > .mapp{position:sticky;top:12px;order:2}
  .mapp .fold{display:none}
}
.send{display:grid;grid-template-columns:110px 1fr;gap:10px}
.send input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px;min-width:0;width:100%}
.send .memo{grid-column:1/-1}
#sendout{font-size:14.5px}
#sendout.ok{color:var(--near);font-weight:600} #sendout.bad{color:var(--far)}

/* 내 정보 */
.me{display:grid;grid-template-columns:130px 1fr 1fr;gap:12px}
.me label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.me input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;min-height:50px;width:100%;min-width:0}
.me input.bad{border-color:var(--far);box-shadow:0 0 0 2px var(--far-bg)}
#meout.bad{color:var(--far);font-weight:600}
.where{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px}
.where b{font-weight:600}
.where .back{padding:0;text-decoration:underline}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer;background:var(--soft);border-radius:10px;padding:12px 14px}
.agree input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--primary)}

/* 아래 고정 바 */
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(20,27,45,.10);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tray-in{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center}
.picks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:thin}
.pk{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:5px 10px 5px 5px;font-size:13.5px;cursor:pointer;max-width:220px}
.pk i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk u{text-decoration:none;color:var(--muted);font-size:15px;line-height:1}
.tray .ph{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:6;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 전형 안내 */
.sel{display:flex;flex-direction:column}
.sel h3{font-size:14px;color:var(--muted);font-weight:600;padding:4px 0 8px}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow .o{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.srow .o.alt{background:var(--soft);color:var(--ink)}
.srow .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .info b{font-size:16.5px;overflow-wrap:anywhere}
.srow .info small{color:var(--muted);font-size:13.5px}
.srow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.srow a{font-size:13.5px;white-space:nowrap}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:15px}
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tl div{border-top:5px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl div.pre{border-color:var(--signal)} .tl div.post{border-color:var(--primary)}
.tl div.me{background:var(--soft);border-radius:0 0 10px 10px;padding:10px 8px 8px}
.tl b{font-family:var(--display);font-weight:400;font-size:19px}
.tl span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.tl em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--near)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kinds div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kinds b{display:block;margin-bottom:2px}
.kinds span{font-size:14.5px;color:var(--muted)}
.kinds div.out{border-style:dashed;grid-column:1/-1;background:var(--soft)}
.final{background:var(--hdr);color:var(--hdr-ink);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.final h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25;text-wrap:balance}
.final p{color:var(--hdr-muted)}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who input{flex:1 1 180px;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
.src{font-size:12.5px;color:var(--muted);line-height:1.7}
.src a{color:inherit}
h2.sec{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.25}
.panel > p{color:var(--muted);font-size:15px;max-width:66ch}
.rules{display:flex;flex-direction:column;gap:6px;font-size:15px}

@media (max-width:640px){
  .brand b{font-size:24px}
  .pick,.fork,.kinds{grid-template-columns:1fr}
  .cats{grid-template-columns:1fr 1fr}
  .verdict{grid-template-columns:1fr}

  const {L, N} = chosen();
  return L.map(x => ({la:x.la, lo:x.lo, n:x.n.replace("여자고등학교", "여고").replace("고등학교", "고"), t:String(x.o), km:x.km, ap:x.ap}))
    .concat(N.map(x => ({la:x.la, lo:x.lo, n:x.n, t:"✓", km:x.km, ap:x.ap}))).filter(m => m.la != null);
}
function mapMode(){
  if(st.mm !== "auto") return st.mm;
  if(st.step === "local") return "sido";
  if(st.step === "nat") return "all";
  return st.nat.some(p => { const x = natItem(p); return x && x.s !== st.sido; }) ? "all" : "sido";
}
function mapPanel(){
  const m = mapMode(), nm = FULL[st.sido].replace(/\(.*\)/, "");
  const pick = st.step !== "done", shut = pick && st.mapShut;
  return '<section class="mapp' + (shut ? " shut" : "") + '" id="mapp"><div class="mh"><b>지도</b>' +
    '<button class="tog" data-mm="sido" aria-pressed="' + (m === "sido") + '" type="button">' + esc(nm) + '</button><button class="tog" data-mm="all" aria-pressed="' + (m === "all") + '" type="button">전국</button>' +
    (pick ? '<button class="tog fold" data-fold="1" type="button">' + (shut ? "펴기" : "접기") + '</button>' : "") + '</div><div id="mapbox"></div></section>';
}
function drawMap(){
  const box = $("#mapbox"); if(!box) return;
  const mode = mapMode(), all = mode === "all";
  const feats = all ? GEO : GEO.filter(f => f.s === st.sido);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  if(all){ x0 = 125.85; x1 = 129.75; y0 = 33.05; y1 = 38.7; }
  else{
    const use = feats.filter(f => f.n !== "옹진군" && f.n !== "울릉군"), src = use.length ? use : feats;
    src.forEach(f => f.p.forEach(r => { for(let i = 0; i < r.length; i += 2){ const x = r[i] / 1000, y = r[i + 1] / 1000; if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; } }));
    const px = (x1 - x0) * 0.05, py = (y1 - y0) * 0.05; x0 -= px; x1 += px; y0 -= py; y1 += py;
  }
  const k = Math.cos((y0 + y1) / 2 * RAD), W = 440, H = Math.round(W * (y1 - y0) / ((x1 - x0) * k));
  const X = lo => (lo - x0) / (x1 - x0) * W, Y = la => (y1 - la) / (y1 - y0) * H;
  const inside = (la, lo) => lo >= x0 && lo <= x1 && la >= y0 && la <= y1;
  const f1 = v => Math.round(v * 10) / 10;
  let o = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="고른 학교 위치 지도"><defs><clipPath id="mc"><rect width="' + W + '" height="' + H + '"/></clipPath></defs><g clip-path="url(#mc)">';
  o += '<path class="m-land" d="' + feats.map(f => f.p.map(r => { let d = ""; for(let i = 0; i < r.length; i += 2) d += (i ? "L" : "M") + f1(X(r[i] / 1000)) + " " + f1(Y(r[i + 1] / 1000)); return d + "Z"; }).join("")).join("") + '"/>';
  if(!all){
    const by = {}; feats.forEach(f => { (by[f.n] = by[f.n] || []).push(f.c); });
    Object.keys(by).forEach(n => { const c = by[n], cx = c.reduce((a, v) => a + v[0], 0) / c.length, cy = c.reduce((a, v) => a + v[1], 0) / c.length; o += '<text class="m-city" x="' + f1(X(cx)) + '" y="' + f1(Y(cy)) + '">' + esc(n.replace(/(특별자치)?[시군구]$/, "") || n) + '</text>'; });
  }
  (all ? [50, 100, 200] : [50, 100]).forEach(d => {
    let p = ""; for(let b = 0; b <= 360; b += 5){ const q = dest(b, d); p += (b ? "L" : "M") + f1(X(q[0])) + " " + f1(Y(q[1])); }
    o += '<path class="m-ring" d="' + p + '"/>';
    const br = [70, 110, 20, 160, 250, 290, 200, 340].map(b => dest(b, d)).find(q => inside(q[1], q[0]) && X(q[0]) > 26 && X(q[0]) < W - 26 && Y(q[1]) > 14 && Y(q[1]) < H - 10);
    if(br) o += '<text class="m-rt" text-anchor="middle" x="' + f1(X(br[0])) + '" y="' + f1(Y(br[1]) + 4) + '">' + d + ' km</text>';
  });
  // 후보 학교 점
  let dots = [];
  if(st.step === "local") dots = localRows().map(i => DATA.loc[i]).filter(r => st.grp[grpOf(K[r[3]])] && r[8] != null).map(r => [r[8], r[9], -1]);
  if(st.step === "nat" && st.cat) dots = DATA.nat[st.cat].filter(x => x.la != null && (st.sub === "all" || x.fd === st.sub) && (!st.only || elig(x) !== "limit")).map(x => [x.la, x.lo, band(x.d)]);
  dots.forEach(d => { if(inside(d[0], d[1])) o += '<circle class="m-dot' + (d[2] >= 0 ? " f" + d[2] : "") + '" cx="' + f1(X(d[1])) + '" cy="' + f1(Y(d[0])) + '" r="' + (d[2] >= 0 ? 3.4 : 2.6) + '"' + (d[2] < 0 ? ' style="fill:var(--muted);stroke:none"' : ' style="stroke:none"') + '/>'; });
  const bx = X(BASE.lo), byy = Y(BASE.la), baseIn = inside(BASE.la, BASE.lo);
  const ms = marks(), shown = ms.filter(m => inside(m.la, m.lo)), out = ms.length - shown.length;
  if(baseIn) shown.forEach(m => { if(m.km >= 0.5) o += '<line class="m-ln s' + band(m.km) + '" x1="' + f1(bx) + '" y1="' + f1(byy) + '" x2="' + f1(X(m.lo)) + '" y2="' + f1(Y(m.la)) + '"/>'; });
  if(baseIn){
    let s = ""; for(let i = 0; i < 10; i++){ const r = i % 2 ? 4.6 : 11, a = (i * 36 - 90) * RAD; s += (i ? "L" : "M") + f1(bx + r * Math.cos(a)) + " " + f1(byy + r * Math.sin(a)); }
    o += '<path class="m-base" d="' + s + 'Z"/><text class="m-lb" x="' + f1(bx - 13) + '" y="' + f1(byy + 4) + '" text-anchor="end">두레자연중</text>';
  }
  const boxes = shown.map(m => [X(m.lo) - 11, Y(m.la) - 11, X(m.lo) + 11, Y(m.la) + 11]);
  if(baseIn) boxes.push([bx - 76, byy - 9, bx + 12, byy + 9]);
  const hit = r => r[0] < 2 || r[2] > W - 2 || r[1] < 2 || r[3] > H - 2 || boxes.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1]);
  let labels = "";
  shown.slice().sort((a, b) => b.la - a.la).forEach(m => {
    const x = X(m.lo), y = Y(m.la), c = band(m.km), txt = m.n + " " + kmText(m.km, m.ap);
    const w = [...txt].reduce((a, ch) => a + (ch.charCodeAt(0) > 255 ? 12.6 : 7), 0), pref = x < W * 0.6;
    let best = null;
    for(const dy of [0, -14, 14, -28, 28, -42, 42, -56, 56]){ for(const right of [pref, !pref]){ const r = right ? [x + 13, y + dy - 8, x + 13 + w, y + dy + 7] : [x - 13 - w, y + dy - 8, x - 13, y + dy + 7]; if(!hit(r)){ best = [right, dy, r]; break; } } if(best) break; }
    if(!best) best = [pref, 0, pref ? [x + 13, y - 8, x + 13 + w, y + 7] : [x - 13 - w, y - 8, x - 13, y + 7]];
    boxes.push(best[2]);
    o += '<circle class="m-mk f' + c + '" cx="' + f1(x) + '" cy="' + f1(y) + '" r="10.5"/><text class="m-mt" x="' + f1(x) + '" y="' + f1(y + 0.5) + '">' + esc(m.t) + '</text>';
    labels += '<text class="m-lb" x="' + f1(x + (best[0] ? 14 : -14)) + '" y="' + f1(y + best[1] + 4) + '" text-anchor="' + (best[0] ? "start" : "end") + '">' + esc(txt) + '</text>';
  });
  o += labels;
  o += '</g></svg>';
  const note = [];
  if(!ms.length) note.push("학교를 고르면 지도에 표시됩니다.");
  if(out) note.push("지도 밖에 고른 학교가 " + out + "곳 있습니다. '전국'을 눌러 보세요.");
  if(!baseIn) note.push("두레자연중학교(경기 화성시 우정읍)는 이 지도 밖에 있습니다.");
  note.push("별은 두레자연중학교, 점선 원은 그곳에서 50 km, 100 km" + (all ? ", 200 km" : "") + " 거리입니다. 번호는 거주지역 지망 순위, ✓는 전국단위 학교이고 색은 거리(초록, 파랑, 빨강)입니다." + (ms.some(m => m.ap) ? " '약'이 붙은 학교는 읍·면·동 중심점 기준의 대략 위치입니다." : ""));
  box.innerHTML = o + '<p class="mn">' + esc(note.join(" ")) + '</p>';
}

/* ---------- 아래 고정 바 ---------- */
function renderTray(){
  const show = st.step === "local" || st.step === "cats" || st.step === "nat";
  tray.hidden = !show; if(!show) return;
  const a = st.local.map((i, n) => '<button class="pk" data-rml="' + i + '" type="button" title="빼기"><i>' + (n + 1) + '</i><span>' + esc(DATA.loc[i][0].replace("고등학교", "고")) + '</span><u aria-hidden="true">×</u></button>');
  const b = st.nat.map((p, n) => '<button class="pk" data-rmn="' + n + '" type="button" title="빼기"><i>✓</i><span>' + esc(p.n) + '</span><u aria-hidden="true">×</u></button>');
  const list = st.step === "local" ? a.concat(b) : b.concat(a);
  picks.innerHTML = list.length ? list.join("") : '<span class="ph">' + (st.step === "local" ? "표에서 학교를 눌러 순위를 정하세요." : "표에서 학교를 눌러 담으세요.") + '</span>';
  $("#next").disabled = !list.length;
}
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- 동작 ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.stn){ const i = +b.dataset.stn; if(!b.classList.contains("done")) return; go(["home","route", st.last || "local", "done"][i]); return; }
  if(b.dataset.go){
    if(st.step === "home" && b.dataset.go === "route"){ const bad = meCheck(); meWarn($("#meout"), bad); if(bad) return; }
    if(b.dataset.go === "local"){ st.q = ""; } go(b.dataset.go); return; }
  if(b.dataset.mm){ st.mm = b.dataset.mm; save(); document.querySelectorAll("[data-mm]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mm === mapMode())); drawMap(); return; }
  if(b.dataset.fold){ st.mapShut = !st.mapShut; save(); $("#mapp").classList.toggle("shut", st.mapShut); b.textContent = st.mapShut ? "펴기" : "접기"; return; }
  if(b.dataset.wide){ st.wide = b.dataset.wide === "1"; save(); render(); return; }
  if(b.dataset.grp){ st.grp[b.dataset.grp] = !st.grp[b.dataset.grp]; save(); render(); return; }
  if(b.dataset.loc){ const i = +b.dataset.loc, k = st.local.indexOf(i);
    if(k >= 0) st.local.splice(k, 1); else if(st.local.length >= MAXL){ toast("5순위까지 정할 수 있습니다. 하나를 빼고 다시 눌러 주세요."); return; } else st.local.push(i);
    save(); const y = window.scrollY; $("#rows").innerHTML = localRowsHtml([...document.querySelectorAll("#rows .row")].map(r => +r.dataset.loc)); renderTray(); drawMap(); window.scrollTo(0, y); return; }
  if(b.dataset.cat){ st.cat = b.dataset.cat; st.sub = "all"; go("nat"); return; }
  if(b.dataset.sub){ st.sub = b.dataset.sub; save(); render(); return; }
  if(b.dataset.only){ st.only = !st.only; save(); render(); return; }
  if(b.dataset.nat){ const n = b.dataset.nat, k = st.nat.findIndex(p => p.c === st.cat && p.n === n);
    if(k >= 0) st.nat.splice(k, 1); else if(st.nat.filter(p => p.c === st.cat).length >= MAXN){ toast("이 유형에서는 2곳까지 담을 수 있습니다."); return; } else st.nat.push({c:st.cat, n:n});
    save(); const on = k < 0; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); $(".rk", b).textContent = on ? "✓" : ""; renderTray(); drawMap(); return; }
  if(b.dataset.rml){ const k = st.local.indexOf(+b.dataset.rml); if(k >= 0) st.local.splice(k, 1); save(); render(); return; }
  if(b.dataset.rmn){ st.nat.splice(+b.dataset.rmn, 1); save(); render(); return; }
  if(b.id === "next"){ go("done"); return; }
  if(b.id === "reset"){ st = {step:"home", sido:st.sido, sgg:st.sgg, ex:false, local:[], nat:[], cat:null, wide:false, grp:{g:true,v:false,s:false,j:false}, only:true, sub:"all", q:"", num:"", name:"", tel:"", memo:"", mm:"auto", mapShut:false}; go("home"); return; }
  if(b.id === "send"){ sendNow(b); return; }
  if(b.id === "copy"){ const txt = copyText(), out = $("#copyout");
    const fail = () => { out.textContent = "복사가 막혀 있습니다. 아래 내용을 직접 길게 눌러 복사하세요."; out.insertAdjacentHTML("afterend", '<pre class="note" style="white-space:pre-wrap;user-select:all">' + esc(txt) + '</pre>'); };
    try{ navigator.clipboard.writeText(txt).then(() => { out.textContent = "복사했습니다. 메신저나 문서에 붙여 넣으세요."; }, fail); }catch(err){ fail(); } return; }
});
document.addEventListener("change", e => {
  if(e.target.id === "sido"){ st.sido = e.target.value; st.sgg = DATA.sgg[st.sido][0]; st.ex = false; st.local = []; st.wide = false; save(); render(); }
  if(e.target.id === "sgg"){ st.sgg = e.target.value; st.ex = false; st.local = []; st.wide = false; save(); render(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ st.q = e.target.value; $("#rows").innerHTML = localRowsHtml(shownLocal(localRows())); }
  const t = e.target;
  if(PRIV.includes(t.id)){
    if(t.id === "num"){ const v = t.value.replace(/\D/g, ""); if(v !== t.value) t.value = v; }
    if(t.id === "tel"){ const v = fmtTel(t.value); if(v !== t.value) t.value = v; }
    st[t.id] = t.value; save();
    if(t.classList.contains("bad")){ t.classList.remove("bad"); const o = $("#meout"); if(o && o.classList.contains("bad")){ o.textContent = ""; o.className = "hint"; } }
  }
});
function copyText(){
  const {L, N} = chosen(), out = [];
  out.push("[고교 선택 길잡이] " + ((st.num ? st.num + "번 " : "") + st.name || "이름 미입력"));
  if(st.tel) out.push("전화번호: " + st.tel);
  out.push("거주 지역: " + whereText() + " (" + status(st.sido, st.sgg).label + ")");
  if(L.length){ out.push("", "거주지역 고등학교"); L.forEach(x => out.push(x.o + "순위 " + x.n + " (" + x.k + ", " + x.t + ", " + x.where + ")")); }
  if(N.length){ out.push("", "전국단위 모집 학교"); N.forEach(x => out.push("- " + x.n + " (" + x.k + ", " + x.t + ", " + x.where + ")")); }
  return out.join("\n");
}
function payload(){
  const {L, N} = chosen(), s = status(st.sido, st.sgg), pick = x => ({name:x.n, kind:x.k, term:x.t, addr:x.adr, km:x.km == null ? "" : Math.round(x.km), approx:x.ap ? 1 : 0, when:x.w});
  return {v:2, num:String(st.num).trim(), name:String(st.name).trim(), tel:fmtTel(st.tel), agree:true, memo:String(st.memo).trim(), sido:st.sido, sgg:st.sido === "세종" ? "" : st.sgg, status:s.label,
    local:L.map(x => Object.assign({rank:x.o}, pick(x))), nat:N.map(x => Object.assign({cat:x.cat}, pick(x)))};
}
function sendNow(btn){
  const out = $("#sendout"), say = (m, c) => { out.textContent = m; out.className = c || "hint"; };
  const d = payload();
  if(!GAS_URL){ say("아직 제출 주소가 연결되지 않았습니다. '선택 내용 복사'로 보내 주세요.", "bad"); return; }
  const bad = meCheck(); meWarn(null, bad);
  if(bad){ say(bad.msg, "bad"); return; }
  if(!d.local.length && !d.nat.length){ say("고른 학교가 없습니다. 학교를 먼저 담아 주세요.", "bad"); return; }
  if(!$("#agree").checked){ say("제출 동의에 표시해 주세요.", "bad"); $("#agree").focus(); return; }
  btn.disabled = true; say("보내는 중입니다...");
  const body = JSON.stringify(d), done = m => { btn.disabled = false; say(m, "ok"); };
  const hhmm = () => { const t = new Date(); return t.getHours() + "시 " + String(t.getMinutes()).padStart(2, "0") + "분"; };
  fetch(GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body})
    .then(r => r.json()).then(j => { if(j && j.ok) done(hhmm() + "에 제출했습니다. 다시 제출하면 앞의 내용을 덮어씁니다. 이 기기를 다음 친구가 쓴다면 '처음부터 다시'를 눌러 주세요.");
      else { const er = new Error((j && j.error) || "응답 오류"); er.server = true; throw er; } })
    .catch(er => er && er.server ? (btn.disabled = false, say("제출하지 못했습니다. " + er.message.replace(/^Error:\s*/, ""), "bad")) : fetch(GAS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body})
      .then(() => done(hhmm() + "에 보냈습니다. 잘 들어갔는지는 선생님께 확인하세요."))
      .catch(() => { btn.disabled = false; say("제출하지 못했습니다. 인터넷 연결을 확인하거나 '선택 내용 복사'로 보내 주세요.", "bad"); }));
}
if(st.step !== "home" && !DATA.sgg[st.sido].includes(st.sgg)) st.step = "home";
st.local = st.local.filter(i => DATA.loc[i]); st.nat = st.nat.filter(p => DATA.nat[p.c] && natItem(p));
render();
})();
</script>
